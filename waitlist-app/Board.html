<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Style'); ?>
  <style>
    body { background: #0f172a; color: #fff; margin: 0; min-height: 100vh; padding: 24px; }
    .board-wrap { max-width: 720px; margin: 0 auto; }
    .brand-header .festival { color: #f59e0b; }
    .brand-header .booth { color: #cbd5e1; }
    .board-subtitle { text-align: center; font-size: 14px; color: #64748b; margin: -12px 0 16px; }

    .current-banner {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(220,38,38,0.35);
    }
    .current-banner.empty { background: #1e293b; box-shadow: none; }
    .current-banner .label { font-size: 20px; opacity: 0.85; margin-bottom: 4px; }
    .current-banner .num { font-size: 96px; font-weight: 900; line-height: 1; }
    .current-banner .name { font-size: 28px; margin-top: 8px; font-weight: 600; }

    .wait-panel { background: #1e293b; border-radius: 16px; padding: 16px 20px; }
    .wait-panel .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .wait-panel .head h2 { font-size: 18px; margin: 0; color: #cbd5e1; }
    .wait-panel .head .count { font-size: 15px; color: #94a3b8; }
    .wait-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .wait-item { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; text-align: center; }
    .wait-item .n { font-size: 26px; font-weight: 800; }
    .wait-item .nm { font-size: 13px; color: #94a3b8; margin-top: 2px; }
    .wait-item.next { border-color: #f59e0b; }
    .wait-item.next .n { color: #f59e0b; }
    .empty-msg { text-align: center; color: #64748b; padding: 20px 0; grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="board-wrap">
    <?!= include('Header'); ?>
    <div class="board-subtitle">실시간 대기 현황판</div>

    <div class="current-banner" id="currentBanner">
      <div class="label">지금 호출 중</div>
      <div class="num" id="currentNum">-</div>
      <div class="name" id="currentName"></div>
    </div>

    <div class="wait-panel">
      <div class="head">
        <h2>대기 순번</h2>
        <span class="count" id="waitCount">대기 0명</span>
      </div>
      <div class="wait-list" id="waitList"></div>
    </div>
  </div>

  <script>
    function refresh() {
      google.script.run
        .withSuccessHandler(function (res) {
          var banner = document.getElementById('currentBanner');
          if (res.current) {
            banner.classList.remove('empty');
            document.getElementById('currentNum').textContent = res.current.number;
            document.getElementById('currentName').textContent = res.current.name;
          } else {
            banner.classList.add('empty');
            document.getElementById('currentNum').textContent = '-';
            document.getElementById('currentName').textContent = '호출 대기 중';
          }

          document.getElementById('waitCount').textContent =
            '대기 ' + res.waitingCount + '명 · 예상 ' + res.estimatedWaitMin + '분';

          var list = document.getElementById('waitList');
          list.innerHTML = '';
          if (!res.waitingList.length) {
            list.innerHTML = '<div class="empty-msg">대기자가 없습니다</div>';
          } else {
            res.waitingList.forEach(function (w, i) {
              var div = document.createElement('div');
              div.className = 'wait-item' + (i === 0 ? ' next' : '');
              div.innerHTML = '<div class="n">' + w.number + '</div><div class="nm">' + w.name + '</div>';
              list.appendChild(div);
            });
          }
          schedulePoll();
        })
        .withFailureHandler(schedulePoll)
        .getBoardData();
    }
    function schedulePoll() {
      setTimeout(refresh, 7000 + Math.random() * 2000);
    }
    refresh();
  </script>
</body>
</html>
